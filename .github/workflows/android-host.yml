name: Synthetic Android host
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install pinned Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: python -m unittest discover -s tests -v
      - run: python tools/android_host.py --fetch-sdl
      - run: python tools/android_host.py --abi x86_64
      - run: python -m pip install -r tools/requirements-android-test.txt
      - name: Enable KVM for the Android virtual device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Vulkan, input and lifecycle on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2
          script: python tools/android_runtime_smoke.py --serial emulator-5554 --apk local/android-host-x86_64/azazel6-host-probe.apk --output local/android-runtime/ci
      - name: Retain synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-android-runtime
          path: local/android-runtime/ci
          if-no-files-found: warn
          retention-days: 14
      - run: python tools/repository_check.py
